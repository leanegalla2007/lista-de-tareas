<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Stock</title>
    <link rel="stylesheet" href="/css/tablestyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <nav class="navbar">
        <div>
            <strong>Gestor de Inventarios</strong>
        </div>
        <div id="usuario-navbar" class="usuario-navbar"></div>
    </nav>

    <div class="header-container">
        <a href="list.html" class="back-link">← Volver a mis listas</a>
        <h1 id="titulo-lista">Cargando...</h1>
    </div>

    <form id="formulario">
        <input id="producto" placeholder="Producto" required>
        <input id="marca" placeholder="Marca">
        <input id="unidad" placeholder="Cant. x unidad">
        <input id="precio" type="number" placeholder="Precio x unidad" step="0.01">
        <input id="fecha" type="date">
        <input id="categoria" placeholder="Categoría" readonly>
        <button class="agregar" type="submit">Agregar</button>
    </form>

    <!-- SECCIÓN DEL BUSCADOR -->
    <div class="search-container my-3" style="max-width: 400px; margin: 0 auto;">
        <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar producto o marca...">
    </div>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Marca</th>
                <th>Unidad</th>
                <th>Precio</th>
                <th>Fecha de Compra</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-cuerpo"></tbody>
    </table>

    <script>
        const API = "http://localhost:3000/stock";
        const listaActiva = localStorage.getItem('lista_activa');
        const usuarioLogueado = localStorage.getItem('usuario_logueado');
        const formulario = document.getElementById("formulario");
        const botonAgregar = formulario.querySelector(".agregar");
        const inputBuscador = document.getElementById("buscador"); // <-- Referencia al buscador
        let enviandoProducto = false;

        if (!usuarioLogueado) {
            alert("No autorizado, inicie sesión.");
            window.location.href = "index.html";
        }

        document.getElementById('titulo-lista').innerText = "Stock: " + listaActiva;
        document.getElementById('categoria').value = listaActiva || "";

        function renderNavbar() { 
            const contenedor = document.getElementById('usuario-navbar');

            if (usuarioLogueado) {
                contenedor.innerHTML = `
                    <span>Usuario: <strong>${usuarioLogueado}</strong></span>
                    <button type="button" class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
                `;
            } else {
                contenedor.innerHTML = '<span>Sesión no iniciada</span>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario_logueado');
            window.location.href = "index.html";
        }

        // Cargar productos
        async function cargar() {
            try {
                const res = await fetch(`${API}?categoria=${listaActiva}`, {
                    method: "GET",
                    headers: {
                        "X-Usuario": usuarioLogueado
                    }
                });
                const data = await res.json();
                const cuerpo = document.getElementById("lista-cuerpo");
                cuerpo.innerHTML = "";

                data.forEach(t => {
                    cuerpo.innerHTML += `
                        <tr id="fila-${t.id}" class="fila-producto">
                            <td><span class="dato dato-producto">${t.producto}</span></td>
                            <td><span class="dato dato-marca">${t.marca || ''}</span></td>
                            <td><span class="dato">${t.unidad || ''}</span></td>
                            <td>$<span class="dato">${t.precio || 0}</span></td>
                            <td><span class="dato">${t.fecha ? t.fecha.split('T')[0] : ''}</span></td>
                            <td><span class="dato">${t.categoria}</span></td>
                            <td>
                                <button class="btn-edit" onclick="activarEdicion(${t.id})">Editar</button>
                                <button class="btn-delete" onclick="borrarUno(${t.id})">Eliminar</button>
                            </td>
                        </tr>`;
                });

                // Si hay algo escrito previamente en el buscador al recargar, reaplica el filtro
                filtrarProductos();
            } catch (e) { console.error("Error al cargar", e); }
        }

        // FUNCIÓN DE FILTRADO EN TIEMPO REAL
        function filtrarProductos() {
            const termino = inputBuscador.value.toLowerCase().trim();
            const filas = document.querySelectorAll(".fila-producto");

            filas.forEach(fila => {
                // Buscamos el texto del producto y de la marca dentro de esta fila
                const textoProducto = fila.querySelector(".dato-producto").innerText.toLowerCase();
                const textoMarca = fila.querySelector(".dato-marca").innerText.toLowerCase();

                // Si el término coincide con el nombre o la marca, se muestra; si no, se oculta
                if (textoProducto.includes(termino) || textoMarca.includes(termino)) {
                    fila.style.display = ""; // Muestra la fila estándar
                } else {
                    fila.style.display = "none"; // Oculta la fila
                }
            });
        }

        // Escuchar el evento de escritura en el buscador
        inputBuscador.addEventListener("input", filtrarProductos);

        // Activar campos de texto en la fila
        function activarEdicion(id) {
            const fila = document.getElementById(`fila-${id}`);
            const celdas = fila.getElementsByClassName('dato');
            const valoresActuales = Array.from(celdas).map(span => span.innerText.replace('$', ''));

            fila.innerHTML = `
                <td><input type="text" id="edit-prod-${id}" value="${valoresActuales[0]}"></td>
                <td><input type="text" id="edit-marc-${id}" value="${valoresActuales[1]}"></td>
                <td><input type="text" id="edit-unid-${id}" value="${valoresActuales[2]}"></td>
                <td><input type="number" id="edit-prec-${id}" value="${valoresActuales[3]}"></td>
                <td><input type="date" id="edit-fech-${id}" value="${valoresActuales[4]}"></td>
                <td><input type="text" id="edit-categ-${id}" value="${valoresActuales[5]}" readonly></td>
                <td>
                    <button class="btn-save" onclick="guardarEdicion(${id})">Guardar</button>
                    <button class="btn-delete" onclick="cargar()">Cancelar</button>
                </td>
            `;
        }

        // Enviar la actualización al servidor (Método PUT)
        async function guardarEdicion(id) {
            const actualizado = {
                producto: document.getElementById(`edit-prod-${id}`).value,
                marca: document.getElementById(`edit-marc-${id}`).value,
                unidad: document.getElementById(`edit-unid-${id}`).value,
                precio: document.getElementById(`edit-prec-${id}`).value,
                fecha: document.getElementById(`edit-fech-${id}`).value,
                categoria: listaActiva
            };

            const res = await fetch(`${API}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Usuario": usuarioLogueado
                },
                body: JSON.stringify(actualizado)
            });

            if (res.ok) cargar();
            else alert("Error al actualizar");
        }

        // Agregar nuevo producto con categoría
        formulario.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (enviandoProducto) return;

            enviandoProducto = true;
            botonAgregar.disabled = true;
            botonAgregar.textContent = "Agregando...";

            if (!listaActiva) {
                alert("No hay lista activa seleccionada.");
                enviandoProducto = false;
                botonAgregar.disabled = false;
                botonAgregar.textContent = "Agregar";
                return;
            }

            try {
                const nuevo = {
                    producto: document.getElementById("producto").value,
                    marca: document.getElementById("marca").value,
                    unidad: document.getElementById("unidad").value,
                    precio: document.getElementById("precio").value,
                    categoria: listaActiva,
                    fecha: document.getElementById("fecha").value
                };

                const res = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Usuario": usuarioLogueado
                    },
                    body: JSON.stringify(nuevo)
                });

                if (!res.ok) {
                    const mensaje = await res.text();
                    alert(mensaje || "No se pudo guardar el producto");
                    return;
                }
                
                formulario.reset();
                document.getElementById('categoria').value = listaActiva || "";
                cargar();
            } finally {
                enviandoProducto = false;
                botonAgregar.disabled = false;
                botonAgregar.textContent = "Agregar";
            }
        });

        // Eliminar un producto
        async function borrarUno(id) {
            if (confirm("¿Eliminar producto?")) {
                const res = await fetch(`${API}/${id}`, { 
                    method: "DELETE",
                    headers: {
                        "X-Usuario": usuarioLogueado
                    }
                });
                
                if (res.ok) cargar();
                else alert("Error al eliminar el producto");
            }
        }

        renderNavbar();
        cargar();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
