<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Listas de Stock</title>
    <!-- 1. CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/liststyle.css">
    <style>
        /* Estilos añadidos inline para asegurar el comportamiento visual del Drag and Drop */
        .card {
            cursor: grab;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            cursor: grabbing;
        }
        /* Clase que se aplica a la tarjeta que se está arrastrando */
        .card.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body class="style">

    <nav class="navbar">
        <div>
            <strong>Gestor de Inventarios</strong>
        </div>
        <div id="usuario-navbar" class="usuario-navbar"></div>
    </nav>

    <h1>Gestor de Inventarios</h1>
    
    <button class="btn-nueva" data-bs-toggle="modal" data-bs-target="#modalNuevaLista">+ Crear Nueva Lista</button>

    <div id="contenedor-listas" class="grid-listas">
        <!-- Las listas aparecerán aquí -->
    </div>

    <!-- Bootstrap -->
    <!-- MODAL 1: CREAR NUEVA LISTA -->
    <div class="modal fade" id="modalNuevaLista" tabindex="-1" aria-labelledby="modalNuevaListaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNuevaListaLabel">Nueva lista de Stock</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nombreListaInput" class="form-label">¿Qué nombre le quieres poner a la nueva lista?</label>
                        <input type="text" class="form-control" id="nombreListaInput" placeholder="Ej. Bebidas, Limpieza..." autocomplete="off">
                        <div id="errorModal" class="text-danger small mt-2" style="display: none;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="procesarNuevaLista()">Crear Lista</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: CONFIRMAR ELIMINACIÓN DE LISTA -->
    <div class="modal fade" id="modalEliminarLista" tabindex="-1" aria-labelledby="modalEliminarListaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarListaLabel">¿Confirmar eliminación?</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas borrar la lista <strong id="nombreListaABorrar">""</strong>?</p>
                    <p class="text-danger small mb-0"><strong>Advertencia:</strong> Esto también eliminará de forma permanente todos tus productos guardados en esta categoría dentro del servidor.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" onclick="confirmarEliminarLista()">Eliminar definitivamente</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Fin de Bootstrap -->

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = "http://localhost:3000/stock";

        // Instancias globales para controlar los modales desde JavaScript
        const modalNuevaListaBS = new bootstrap.Modal(document.getElementById('modalNuevaLista'));
        const modalEliminarListaBS = new bootstrap.Modal(document.getElementById('modalEliminarLista'));

        // Variables temporales para recordar qué lista se quiere borrar entre clics
        let listaSeleccionadaParaBorrar = { nombre: "", index: -1 };

        const usuarioLogueado = localStorage.getItem('usuario_logueado');
        
        // LÓGICA PARA MOSTRAR EL BOTÓN DE ADMIN
        function verificarRolAdmin() {
            const btnAdmin = document.getElementById('btn-admin-panel');
            
            // Si el usuario es "admin", hacemos visible el botón
            // (Cambia "admin" por el nombre exacto de tu usuario administrador de pruebas si es diferente)
            if (usuarioLogueado === 'admin' && btnAdmin) {
                btnAdmin.style.display = 'inline-block';
            }
        }

        // Ejecuta la función al cargar la página
        verificarRolAdmin()

        if (!usuarioLogueado) {
            alert("Debes iniciar sesión para acceder a tus listas.");
            window.location.href = "index.html";
        }

        const claveListas = `nombres_tablas_${usuarioLogueado}`;
        let listas = JSON.parse(localStorage.getItem(claveListas)) || [];
        let seEstaArrastrando = false;

        function renderNavbar() {
            const contenedor = document.getElementById('usuario-navbar');
            if (usuarioLogueado) {
                contenedor.innerHTML = `
                    <span>Usuario: <strong>${usuarioLogueado}</strong></span>
                    <button type="button" class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
                    <button id="btn-admin-panel" class="btn btn-danger" style="display: none;" onclick="window.location.href='usuarios.html'">
                            ⚙️ Panel Admin (Usuarios)
                    </button>
                `;
            } else {
                contenedor.innerHTML = '<span>Sesión no iniciada</span>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario_logueado');
            window.location.href = "index.html"; 
        }

        async function obtenerResumenPorCategoria() {
            try {
                const res = await fetch(API, {
                    method: "GET",
                    headers: { "X-Usuario": usuarioLogueado }
                });
                if (!res.ok) return {};

                const productos = await res.json();
                const resumen = {};

                productos.forEach((item) => {
                    if (!item.categoria) return;

                    if (!resumen[item.categoria]) {
                        resumen[item.categoria] = { total: 0, productos: [] };
                    }

                    resumen[item.categoria].total += 1;
                    if (
                        item.producto &&
                        resumen[item.categoria].productos.length < 3 &&
                        !resumen[item.categoria].productos.includes(item.producto)
                    ) {
                        resumen[item.categoria].productos.push(item.producto);
                    }
                });

                return resumen;
            } catch (error) {
                console.error("Error al obtener resumen:", error);
                return {};
            }
        }

        async function renderizar() {
            const contenedor = document.getElementById('contenedor-listas');
            contenedor.innerHTML = "";
            const resumen = await obtenerResumenPorCategoria();
            
            if (listas.length === 0) {
                contenedor.innerHTML = "<p>No tienes listas creadas. ¡Empieza por crear una!</p>";
                return;
            }
            
            listas.forEach((nombre, index) => {
                const datos = resumen[nombre] || { total: 0, productos: [] };
                const preview = datos.productos.length
                    ? datos.productos.join(", ")
                    : "Sin productos todavía";

                // Retiramos el onclick de la tarjeta para usarlo puramente de Drag & Drop
                // y añadimos un botón explícito para entrar a la lista.
                contenedor.innerHTML += `
                    <div class="card" draggable="true" data-nombre="${nombre}">
                        <button class="btn-borrar" title="Eliminar lista" onclick="prepararEliminado(event, '${nombre}', ${index})">x</button>
                        <h3>${nombre}</h3>
                        <p>${datos.total} producto(s)</p>
                        <p>${preview}</p>
                        <button class="btn btn-outline-primary btn-sm mt-2" onclick="abrirLista('${nombre}')">Entrar a la Tabla</button>
                    </div>
                `;
            });

            // Una vez añadidas las tarjetas al DOM, activamos los listeners para arrastrarlas
            
        }

        
        // Limpieza de inputs y errores al abrir modal de creación
        document.getElementById('modalNuevaLista').addEventListener('show.bs.modal', () => {
            document.getElementById('nombreListaInput').value = "";
            document.getElementById('errorModal').style.display = "none";
        });

        function procesarNuevaLista() {
            const input = document.getElementById('nombreListaInput');
            const nombre = input.value;
            
            if (!nombre || nombre.trim() === "") {
                mostrarError("El nombre no puede estar vacío.");
                return;
            }

            const nombreLimpio = nombre.trim();
            const limiteLetras = 30;

            if (nombreLimpio.length > limiteLetras) {
                mostrarError(`El nombre es muy largo. Máximo ${limiteLetras} caracteres.`);
                return;
            }

            const nombreNormalizado = nombreLimpio.toLowerCase();
            const existeDuplicado = listas.map(l => l.toLowerCase()).includes(nombreNormalizado);

            if (!existeDuplicado) {
                listas.push(nombreLimpio);
                guardarListas(); 
                renderizar();
                modalNuevaListaBS.hide();
            } else {
                mostrarError("Ya existe una lista con ese nombre.");
            }
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('errorModal');
            errorDiv.textContent = mensaje;
            errorDiv.style.display = "block";
        }

        function prepararEliminado(event, nombre, index) {
            event.stopPropagation(); // Evita que se dispare el abrirLista() de la tarjeta o el drag

            listaSeleccionadaParaBorrar.nombre = nombre;
            listaSeleccionadaParaBorrar.index = index;

            document.getElementById('nombreListaABorrar').textContent = `"${nombre}"`;
            modalEliminarListaBS.show();
        }

        async function confirmarEliminarLista() {
            const { nombre, index } = listaSeleccionadaParaBorrar;

            try {
                const res = await fetch(`${API}?categoria=${encodeURIComponent(nombre)}`, {
                    method: "DELETE",
                    headers: {
                        "X-Usuario": usuarioLogueado 
                    }
                });

                if (res.ok) {
                    listas.splice(index, 1);
                    guardarListas();
                    renderizar();
                    modalEliminarListaBS.hide();
                } else {
                    alert("Error al borrar los datos del servidor.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }
        
        function guardarListas() {
            localStorage.setItem(claveListas, JSON.stringify(listas));
        }

        function abrirLista(nombre) {
            localStorage.setItem('lista_activa', nombre);
            window.location.href = "table.html";
        }

        renderNavbar();
        renderizar();
    </script>
</body>
</html>
