<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al Sistema</title>
    <link rel="stylesheet" href="/css/indexstyle.css"> <!-- Reutiliza tus estilos -->
</head>
<body class="style">

    <nav class="navbar">
        <div>
            <strong>Gestor de Inventarios</strong>
        </div>
        <div id="usuario-navbar" class="usuario-navbar"></div>
    </nav>

    <div class="auth-container">
        <div class="tabs">
            <button id="btn-tab-login" class="tab-btn active" onclick="cambiarTab('login')">Iniciar Sesión</button>
            <button id="btn-tab-registro" class="tab-btn" onclick="cambiarTab('registro')">Registrarse</button>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="form-login">
            <h2>Ingresar</h2>
            <div class="form-group">
                <input type="text" id="user-login" placeholder="Usuario" required>
            </div>
            <div class="form-group">
                <input type="password" id="pass-login" placeholder="Contraseña" required>
            </div>
            <button class="iniciarsesion" type="submit">Entrar</button>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="form-registro" class="oculto">
            <h2>Crear Cuenta</h2>
            <div class="form-group">
                <input type="text" id="user-reg" placeholder="Escribe un usuario" required>
            </div>
            <div class="form-group">
                <input type="password" id="pass-reg" placeholder="Escribe una contraseña" required>
            </div>
            <button type="submit" class="registrar">Registrarme</button>
        </form>
    </div>

    <script>
        const API_AUTH = "http://localhost:3000";

        // let.cuentas = JSON.parse(localStorage.getItem('cuentas')) || {};

        function renderNavbar() {
            const usuario = localStorage.getItem('usuario_logueado');
            const contenedor = document.getElementById('usuario-navbar');

            if (usuario) {
                contenedor.innerHTML = `
                    <span>Usuario: <strong>${usuario}</strong></span>
                    <button type="button" class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
                `;
            } else {
                contenedor.innerHTML = '<span>Sesión no iniciada</span>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario_logueado');
            window.location.href = "index.html";
            renderNavbar();
        }

        // Alternar entre pestañas de Login y Registro
        function cambiarTab(tipo) {
            if (tipo === 'login') {
                document.getElementById('form-login').classList.remove('oculto');
                document.getElementById('form-registro').classList.add('oculto');
                document.getElementById('btn-tab-login').classList.add('active');
                document.getElementById('btn-tab-registro').classList.remove('active');
            } else {
                document.getElementById('form-login').classList.add('oculto');
                document.getElementById('form-registro').classList.remove('oculto');
                document.getElementById('btn-tab-login').classList.remove('active');
                document.getElementById('btn-tab-registro').classList.add('active');
            }
        }

        // Lógica de Registro
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('user-reg').value;
            const password = document.getElementById('pass-reg').value;

            const res = await fetch(`${API_AUTH}/registrar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const mensaje = await res.text();
            alert(mensaje);
            if (res.ok) {
                localStorage.setItem('usuario_logueado', usuario);
                e.target.reset();
                renderNavbar();
                cambiarTab('login'); // Lo manda a loguearse tras registrarse
            }
        });

        // Lógica de Login
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('user-login').value;
            const password = document.getElementById('pass-login').value;

            const res = await fetch(`${API_AUTH}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            if (res.ok) {
                alert("¡Bienvenido al sistema!");
                // Guardamos en localStorage que el usuario inició sesión
                localStorage.setItem('usuario_logueado', usuario);
                renderNavbar();
                window.location.href = "list.html"; // Redirige al panel principal
            } else {
                const error = await res.text();
                alert(error);
            }
        });

        renderNavbar();
    </script>
</body>
</html>
