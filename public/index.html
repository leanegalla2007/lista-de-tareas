<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas</title>
</head>
<body>
    
    <form id="formulario">
        <input id="producto" placeholder="Nombre del producto" name="producto">
        <input id="marca" placeholder="Marca" name="marca">
        <input id="unidad" placeholder="Unidad" name="unidad">
        <input id="precio" placeholder="Precio x unidad" name="precio">
        <input id="fecha" type="date" name="fecha">
        <button type="submit">Agregar</button>
    </form>

    <button onclick="borrarTodo()" style="background-color: #ff4d4d; color: white; margin-top: 10px; cursor: pointer;">
        Vaciar Lista
    </button>

    <table border="1">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Marca</th>
                <th>Unidad</th>
                <th>Precio</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script> 
        const API = "http://localhost:3000/tareas";
        const input = document.getElementById("producto");
        const marca = document.getElementById("marca");
        const unidad = document.getElementById("unidad");
        const precio = document.getElementById("precio");
        const fecha = document.getElementById("fecha");
        const lista = document.getElementById("lista");
        
        const formulario = document.getElementById("formulario");

        function formatearFecha(fechaISO) {
            if (!fechaISO) return "";

            const fechaObj = new Date(fechaISO);
            return new Intl.DateTimeFormat("es-ES", {
                day: "2-digit",
                month: "2-digit",
                year: "2-digit"
            }).format(fechaObj);
        }

        async function cargar() {
            try {
                const res = await fetch(API);
                if (!res.ok) {
                    const mensaje = await res.text();
                    alert(mensaje || "Error al cargar las tareas");
                    return;
                }

                const data = await res.json();
                lista.innerHTML = "";
                data.forEach(t => {
                    // Se agrega el botón "Eliminar" en cada fila usando el ID del producto
                    lista.innerHTML += `
                        <tr>
                            <td>${t.producto}</td>
                            <td>${t.marca}</td>
                            <td>${t.unidad}</td>
                            td>${t.precio}</td>
                            <td>${formatearFecha(t.fecha)}</td>
                            <td>
                                <button onclick="borrarUno(${t.id})" style="color: red; cursor: pointer;">
                                    Eliminar
                                </button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                alert("No se pudo conectar con el servidor");
                console.error(error);
            }
        }

        // --- NUEVA FUNCIÓN PARA BORRAR UN SOLO PRODUCTO ---
        async function borrarUno(id) {
            if (!confirm("¿Deseas eliminar este producto específico?")) return;

            try {
                const res = await fetch(`${API}/${id}`, {
                    method: "DELETE"
                });

                if (res.ok) {
                    cargar(); // Recargamos la tabla
                } else {
                    alert("Error al eliminar el producto");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function cargar() {
            try {
                const res = await fetch(API);

                if (!res.ok) {
                    const mensaje = await res.text();
                    alert(mensaje || "Error al cargar las tareas");
                    return;
                }

                const data = await res.json();
                lista.innerHTML = "";
                data.forEach(t => {
                    lista.innerHTML += `<tr><td>${t.producto}</td><td>${t.marca}</td><td>${t.unidad}</td><td>${t.precio}</td><td>${formatearFecha(t.fecha)}</td><td><button onclick="borrarUno(${t.id})" style="color: red; cursor: pointer;">Eliminar</button></td></tr>`;
                });
            } catch (error) {
                alert("No se pudo conectar con el servidor");
                console.error(error);
            }
        }

        async function borrarTodo() {
            if (!confirm("¿Estás seguro de que quieres borrar TODA la lista?")) return;

            try {
                const res = await fetch(API, {
                    method: "DELETE"
                });

                if (!res.ok) {
                    alert("Error al vaciar la lista");
                    return;
                }

                alert("Lista vaciada");
                cargar();
            } catch (error) {
                alert("No se pudo conectar con el servidor");
                console.error(error);
            }
        }

        async function agregar() {
            const producto = input.value.trim();
            const marcaValue = marca.value.trim();
            const unidadValue = document.getElementById("unidad").value.trim();
            const fechaValue = fecha.value;
            const precioValue = precio.value.trim();

            try {
                const res = await fetch(API, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ producto, fecha: fechaValue, marca: marcaValue, unidad: unidadValue, precio: precioValue })
                });

                if (!res.ok) {
                    const mensaje = await res.text();
                    alert(mensaje || "No se pudo guardar la tarea");
                    return;
                }

                input.value = "";
                marca.value = "";
                document.getElementById("unidad").value = "";
                fecha.value = "";
                precio.value = "";
                cargar();
            } catch (error) {
                alert("No se pudo conectar con el servidor");
                console.error(error);
            }
        }

        formulario.addEventListener("submit", (e) => {
            e.preventDefault();
            agregar();
        });

        cargar(); // Carga inicial
    </script>
</body>
</html>
